<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Transparent ground, so the mark sits on whatever surface the
       client uses rather than carrying its own dark square around. Every
       layer emits: an ambient haze, a blooming ring, and a core graded
       out to a burnt-white centre. -->
  <defs>
    <radialGradient id="haze">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="34%" stop-color="#fdf3f8"/>
      <stop offset="72%" stop-color="#f7c6e0"/>
      <stop offset="100%" stop-color="#eab6d4"/>
    </radialGradient>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.1"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#haze)"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#7dd3fc"
          stroke-width="2.5" opacity="0.95" filter="url(#bloom)"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#a5e6ff" stroke-width="2.4"/>
  <circle cx="32" cy="32" r="14.5" fill="#f7c6e0" opacity="0.45" filter="url(#bloom)"/>
  <circle cx="32" cy="32" r="13.1" fill="url(#core)"/>
</svg>
