name = "kheeras-case-method"
main = "worker/index.js"
compatibility_date = "2026-07-27"

# Worker logs, so `wrangler tail` has something to receive.
#
# Off by default, and silently: console.log in the Worker runs, reaches
# nobody, and nothing anywhere says the logs were dropped rather than
# never written. That matters here because /api/coach reports whether the
# prompt cache engaged, and a cache that quietly stopped working looks
# exactly like a cache that was never checked on.
#
# invocation_logs adds one line per request — the method, path, status and
# duration — which is what makes a missing log distinguishable from a
# request that never arrived.
#
# This is deploy-time configuration: it takes effect on the next deploy,
# not on merge.
[observability.logs]
enabled = true
invocation_logs = true

# public/ holds the served site and nothing else.
#
# This must NOT point at the repo root. `wrangler dev` watches the assets
# directory recursively and does not honour `.assetsignore` (or accept any
# ignore list), so a root-level directory puts .wrangler/ inside the watched
# tree — local D1 writes on every request, which retriggers the reload, which
# serves another request. Giving the assets their own directory means the
# watcher only ever sees files a human edits.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "interview-case-files"
database_id = "de7dfe1a-f7ac-4273-8607-e5691b6d6389"

# AI practice (Text + Live Voice) needs ANTHROPIC_API_KEY.
#
# It is a SECRET, so it is deliberately absent from this file — this file
# is committed, secrets are not. Set it once with:
#
#   npx wrangler secret put ANTHROPIC_API_KEY
#
# and locally in .dev.vars (already gitignored):
#
#   ANTHROPIC_API_KEY=sk-ant-...
#
# Without it, /api/coach answers 503 and the two AI modes say so plainly;
# the manual scorecard and Send to Claude keep working regardless.
#
# COACH_MODEL is an optional plain var — set it here to override the
# default (claude-sonnet-5), e.g. for a cheaper model:
#
# [vars]
# COACH_MODEL = "claude-haiku-4-5-20251001"
#
# A model set here must also appear in the Pricing table in
# worker/index.js. One that doesn't is billed at the most expensive
# known rate, which keeps caps honest but will fire them early.

# Two more secrets guard the two AI modes. Like the API key, they are
# absent from this file because it is committed:
#
#   npx wrangler secret put OWNER_PASSPHRASE   # unlocks the "kheera" account
#   npx wrangler secret put ADMIN_TOKEN        # unlocks /api/admin/codes
#
# and locally in .dev.vars alongside the key.
#
# Both fail closed. Without OWNER_PASSPHRASE the codename "kheera" cannot
# be signed in as at all — better an owner locked out than a codename
# anyone can type for unlimited API access. Without ADMIN_TOKEN the admin
# routes answer 404, so a deployment that forgot to set it does not
# quietly expose invite-code minting to the internet.
#
# OWNER_USERNAME is an optional plain var if the owner codename should be
# something other than "kheera":
#
# [vars]
# OWNER_USERNAME = "kheera"
